name: Reconcile schedule slugs

on:
  schedule:
    # Every ~3 days at 09:00 UTC. GitHub resets */3 at month boundaries, so the
    # gap can be 1-3 days around the 1st. Harmless here, documented so it is
    # not mistaken for a bug.
    - cron: '0 9 */3 * *'
  workflow_dispatch:

# Serialize: two runs committing to main at once would conflict.
concurrency:
  group: reconcile-schedule
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Full history: the script's push-race retry does `git pull --rebase`
          # once before giving up. actions/checkout's default fetch-depth: 1
          # (a shallow clone) can leave rebase without a merge base to work
          # from, failing the exact retry this depth exists to support.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Guard the guards: if the classifier is broken, do not let it commit.
      # Hermetic only — pnpm test:live is intentionally not run here; a
      # third-party outage must not be able to turn this job red before the
      # reconcile step even runs (the script itself handles an unreachable
      # host gracefully and emails about it).
      - name: Run tests
        run: pnpm test

      - name: Reconcile
        run: pnpm reconcile
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RECONCILE_NOTIFY_TO: ${{ secrets.RECONCILE_NOTIFY_TO }}
